name: Build Helfy Tracker APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare app
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir www
          cp index.html sw.js manifest.json icon.png www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm i maplibre-gl@4.7.1
          cp node_modules/maplibre-gl/dist/maplibre-gl.js node_modules/maplibre-gl/dist/maplibre-gl.css www/
          sed -i 's#https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/#./#g' www/index.html www/sw.js
          npx cap init "Helfy Tracker" com.helfy.tracker --web-dir www
          npx cap add android
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' android/app/src/main/AndroidManifest.xml
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; z=${d##*:}
            convert icon.png -resize ${z}x${z} android/app/src/main/res/mipmap-$n/ic_launcher.png
            cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HelfyTracker.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Helfy Tracker v${{ github.run_number }}
          files: HelfyTracker.apk
